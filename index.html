<script>// =====================================================================
//  ANSIEDAD · puzle relajante de semillas y macetas
//  Reglas de diseño: sin tiempo límite, sin derrotas bruscas, colores pastel, sonidos suaves.
//  Prohibido: cajas de botín, azar de pago, cuentas atrás falsas, mensajes de culpa.
// =====================================================================

// ---------- Configuración (lo único que hay que tocar para publicar) ----------
const CFG = {
  version: '1.0.0',
  pruebaPagos: true,        // true = las compras son SIMULADAS (no se cobra nada). Poner false al conectar la tienda real.
  anunciosSimulados: true,  // true = los anuncios son un recuadro de prueba
  interCada: 5,             // un anuncio (que se puede quitar) cada N niveles
  interDesde: 8,            // …a partir del nivel
  monedasInicio: 150,
  cap: 4,                   // semillas por maceta
  costePista: 30,
  costeDeshacer: 20,
  costeMaceta: 100,
  deshacerGratis: 3,        // por nivel
  precios: {                // textos que se muestran (los precios reales los pone Google Play)
    monedas1: '0,99 €', monedas2: '2,99 €', monedas3: '5,99 €', monedas4: '12,99 €',
    sinAnuncios: '3,99 €', jardinMas: '2,99 €/mes', pack: '1,99 €'
  }
};

// ---------- Utilidades ----------
const $ = (s, r = document) => r.querySelector(s);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const ease = {
  out: t => 1 - Math.pow(1 - t, 3),
  inOut: t => (t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2),
  back: t => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2); },
  elastic: t => (t === 0 || t === 1 ? t : Math.pow(2, -10 * t) * Math.sin((t * 10 - 0.75) * (2 * Math.PI / 3)) + 1)
};
function rng(seed) {
  let a = seed >>> 0;
  return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
}
function mezcla(arr, r) { for (let i = arr.length - 1; i > 0; i--) { const j = Math.floor(r() * (i + 1)); [arr[i], arr[j]] = [arr[j], arr[i]]; } return arr; }
const hoy = () => { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); };
const fmt = n => String(Math.round(n)).replace(/\B(?=(\d{3})+(?!\d))/g, '.');

// ---------- Catálogo ----------
// Semillas / flores: 10 colores bien distintos
const COLORES = [
  { n: 'Rosa', b: '#F7A8C4', l: '#FFD9E6', d: '#D9709A', g: '♥' },
  { n: 'Amarillo', b: '#F8D45A', l: '#FFF0A8', d: '#D9A92C', g: '★' },
  { n: 'Azul', b: '#6EA8F7', l: '#BCD8FF', d: '#4378C9', g: '◆' },
  { n: 'Verde', b: '#5FCF8F', l: '#B5F0CC', d: '#37A068', g: '✚' },
  { n: 'Lila', b: '#B08CF2', l: '#DCC9FF', d: '#7E5BC4', g: '☾' },
  { n: 'Naranja', b: '#F7A15B', l: '#FFD3AE', d: '#D97A2C', g: '▲' },
  { n: 'Turquesa', b: '#4FCFCF', l: '#B0F0F0', d: '#2AA0A6', g: '●' },
  { n: 'Rojo', b: '#E5484D', l: '#FFAAAC', d: '#B52D3B', g: '■' },

  { n: 'Marrón', b: '#A9745B', l: '#D9B5A2', d: '#7A4E3A', g: '♣' }
];

const TEMAS = {
  amanecer: { n: 'Amanecer', precio: 0, osc: false, f: ['#FFF6E8', '#FCE4D6', '#F8D3D9'], blobs: ['#FFD9B8', '#FFC9D6', '#FFF1B8'], suelo: '#EBCBA8' },
  jardin: { n: 'Jardín', precio: 200, osc: false, f: ['#F2FBEF', '#D8F2DD', '#BFE8D2'], blobs: ['#B8EBC4', '#E3F7B8', '#B8E9F0'], suelo: '#C7E3B5' },
  atardecer: { n: 'Atardecer', precio: 350, osc: false, f: ['#FFEBDD', '#F9CFDB', '#D9C9F2'], blobs: ['#FFBFA8', '#F7B3D1', '#CDB8F5'], suelo: '#E6C2C8' },
  noche: { n: 'Noche', precio: 500, osc: true, f: ['#2B2A5E', '#3A3578', '#58468F'], blobs: ['#5C5BC4', '#8A5BC4', '#3F7FC4'], suelo: '#4A3F7A' },
  aurora: { n: 'Aurora', precio: -1, osc: true, f: ['#14304A', '#1F5A6B', '#3C8A7C'], blobs: ['#46D6B0', '#6A8CF0', '#B070F0'], suelo: '#2A5E66', plus: true }
};
const SEMILLAS = {
  brillo: { n: 'Clásicas', precio: 0 },
  gema: { n: 'Gemas', precio: 250 },
  burbuja: { n: 'Burbujas', precio: 300 },
  caramelo: { n: 'Caramelos', precio: 400 }
};
const MACETAS = {
  terracota: { n: 'Terracota', precio: 0, rim: '#D98F6B', rim2: '#B8704E', band: '#E7A07C' },
  azul: { n: 'Cerámica azul', precio: 250, rim: '#6C9BD6', rim2: '#4A78B5', band: '#8DB4E8' },
  blanca: { n: 'Nórdica', precio: 300, rim: '#F1EDE6', rim2: '#CFC7BA', band: '#FFFFFF' },
  madera: { n: 'Madera', precio: 350, rim: '#B9885C', rim2: '#8E6339', band: '#CFA073' }
};
// Especies de flor: se desbloquean con el progreso (una cada 8 niveles)
const ESPECIES = [
  { n: 'Margarita', f: 'margarita' }, { n: 'Rosa', f: 'rosa' }, { n: 'Tulipán', f: 'tulipan' }, { n: 'Girasol', f: 'girasol' },
  { n: 'Loto', f: 'loto' }, { n: 'Amapola', f: 'amapola' }, { n: 'Cerezo', f: 'cerezo' }, { n: 'Hortensia', f: 'hortensia' },
  { n: 'Orquídea', f: 'orquidea' }, { n: 'Estrella', f: 'estrella' }, { n: 'Lavanda', f: 'lavanda' }, { n: 'Flor de luna', f: 'luna' }
];

// ---------- Estado guardado en el móvil ----------

// Flor con tallo y hojas que crece desde (x, yBase) hasta (x, yTop). prog 0..1

// ---------- Macetas ----------
function dibujaMaceta(ctx, x, y, w, h, skin, d, o = {}) {
  const baseH = d * 0.55, rimH = d * 0.26;
  // sombra en el suelo
  ctx.fillStyle = 'rgba(80,50,30,.16)'; ctx.beginPath(); ctx.ellipse(x + w / 2, y + h + d * .1, w * .56, d * .17, 0, 0, TAU); ctx.fill();
  // cuerpo de cristal

  rr(ctx, x, y + rimH * .5, w, h - rimH * .5, cuerpo);
  const g = ctx.createLinearGradient(x, 0, x + w, 0);
  g.addColorStop(0, 'rgba(255,255,255,.55)'); g.addColorStop(.45, 'rgba(255,255,255,.16)'); g.addColorStop(1, 'rgba(255,255,255,.42)');
  ctx.fillStyle = g; ctx.fill();
  ctx.strokeStyle = o.sel ? 'rgba(255,255,255,1)' : 'rgba(255,255,255,.85)'; ctx.lineWidth = 2; ctx.stroke();
  ctx.strokeStyle = 'rgba(120,90,70,.22)'; ctx.lineWidth = 1; rr(ctx, x - 1, y + rimH * .5 - 1, w + 2, h - rimH * .5 + 2, cuerpo); ctx.stroke();
  // base de color de la maceta + tierra
  ctx.save(); rr(ctx, x, y + rimH * .5, w, h - rimH * .5, cuerpo); ctx.clip();
  const gb = ctx.createLinearGradient(x, 0, x + w, 0); gb.addColorStop(0, skin.band); gb.addColorStop(.5, skin.rim); gb.addColorStop(1, skin.rim2);
  ctx.fillStyle = gb; ctx.fillRect(x, y + h - baseH, w, baseH);
  ctx.fillStyle = 'rgba(255,255,255,.18)'; ctx.fillRect(x, y + h - baseH, w, baseH * .16);
  ctx.restore();
  ctx.fillStyle = '#6b4a31'; ctx.beginPath(); ctx.ellipse(x + w / 2, y + h - baseH, w * .42, d * .14, 0, 0, TAU); ctx.fill();
  ctx.fillStyle = '#7e593b'; ctx.beginPath(); ctx.ellipse(x + w / 2 - w * .08, y + h - baseH - d * .02, w * .3, d * .08, 0, 0, TAU); ctx.fill();

}
function dibujaMacetaFrente(ctx, x, y, w, h, skin, d) {          // borde superior y brillo, encima de las semillas
  const rimH = d * 0.26;
  const g = ctx.createLinearGradient(x, 0, x + w, 0); g.addColorStop(0, skin.band); g.addColorStop(.5, skin.rim); g.addColorStop(1, skin.rim2);

}

// ---------- Fondos ----------
const FONDO = { estrellas: null, polen: null };
function iniciaFondo() {
  const r = rng(99);
  FONDO.estrellas = Array.from({ length: 70 }, () => ({ x: r(), y: r() * .8, s: .5 + r() * 1.6, f: r() * 6 }));
  FONDO.polen = Array.from({ length: 22 }, () => ({ x: r(), y: r(), v: .006 + r() * .012, s: 2 + r() * 4, f: r() * 6 }));
}
function dibujaFondo(ctx, w, h, tema, t) {
  const T = TEMAS[tema] || TEMAS.amanecer;
  const g = ctx.createLinearGradient(0, 0, 0, h); g.addColorStop(0, T.f[0]); g.addColorStop(.55, T.f[1]); g.addColorStop(1, T.f[2]);
  ctx.fillStyle = g; ctx.fillRect(0, 0, w, h);

    const bx = w * (.2 + .3 * i) + Math.sin(t * .15 + i * 2) * w * .08, by = h * (.25 + .25 * i) + Math.cos(t * .12 + i) * h * .05, br = Math.max(w, h) * .45;
    const rg = ctx.createRadialGradient(bx, by, 0, bx, by, br); rg.addColorStop(0, c + 'aa'); rg.addColorStop(1, c + '00');

    ctx.globalAlpha = 1;
  }

    const px = ((p.x + Math.sin(t * .3 + p.f) * .03) % 1) * w, py = (((p.y - t * p.v) % 1) + 1) % 1 * h;
    ctx.globalAlpha = T.osc ? .55 : .5; ctx.fillStyle = T.osc ? '#ffe9a0' : '#fff'; ctx.beginPath(); ctx.arc(px, py, p.s * (T.osc ? .8 : 1), 0, TAU); ctx.fill();

// =====================================================================
//  TABLERO: disposición, entrada táctil, animaciones y partículas
// =====================================================================
const cv = $('#c'), ctx = cv.getContext('2d');
const T = {
  w: 0, h: 0, dpr: 1, t: 0, modo: 'home',
  n: 1, prm: null, pots: [], ini: [], vis: [], hist: [], sel: -1, vuelos: [], parts: [], pista: null, slots: [], d: 60,
  usadosDeshacer: 0, extra: false, fin: false, finT: 0, ganando: false, mov: 0, espCol: [], bloqueaModal: false, floresNivel: 0
};
const nuevoVis = () => ({ sel: 0, shake: 0, bloom: null, llega: 0 });

function ajusta() {
  T.dpr = Math.min(window.devicePixelRatio || 1, 2.5);
  T.w = window.innerWidth; T.h = window.innerHeight;
  cv.width = Math.round(T.w * T.dpr); cv.height = Math.round(T.h * T.dpr);
  ctx.setTransform(T.dpr, 0, 0, T.dpr, 0, 0);
  layout();
}
window.addEventListener('resize', ajusta);

// ---------- Disposición de las macetas ----------
function layout() {
  const P = T.pots.length;
  if (!P) { T.slots = []; return; }
  const top = 92, bottom = T.h - 124, W = T.w - 20, H = Math.max(200, bottom - top);
  let mejor = null;
  for (let cols = Math.min(P, 2); cols <= Math.min(P, 7); cols++) {
    const rows = Math.ceil(P / cols), sw = W / cols, sh = H / rows;
    const d = Math.min(sw * 0.68, (sh * 0.80) / (CAP * 1.08 + 0.85), 104);
    if (!mejor || d > mejor.d + 0.5) mejor = { cols, rows, sw, sh, d };
  }
  const { cols, rows, sw, sh, d } = mejor;
  T.d = d;
  const w = d * 1.3, h = CAP * d * 1.08 + d * 0.85;
  T.slots = [];
  for (let i = 0; i < P; i++) {
    const r = Math.floor(i / cols), c = i % cols;
    const enFila = r === rows - 1 ? P - r * cols : cols;
    const x0 = 10 + (cols - enFila) * sw / 2;
    const cx = x0 + (c + 0.5) * sw;
    const cy = top + H / rows * (r + 0.5) + d * 0.25;
    T.slots.push({ x: cx - w / 2, y: cy - h / 2, w, h, cx });
  }
}
function posSemilla(i, j) {
  const s = T.slots[i], d = T.d, baseH = d * 0.55;
  return { x: s.cx, y: s.y + s.h - baseH - (j + 0.5) * d * 1.08 - d * 0.04 };
}

// ---------- Nivel ----------
function empiezaNivel(n) {
  const L = generaNivel(n);
  T.n = n; T.prm = L.prm; T.pots = L.pots; T.ini = copia(L.pots);
  T.vis = T.pots.map(nuevoVis); T.hist = []; T.sel = -1; T.vuelos = []; T.pista = null;
  T.usadosDeshacer = 0; T.extra = false; T.fin = false; T.ganando = false; T.mov = 0; T.floresNivel = 0;
  const r = rng(n * 31 + 7), libres = ESPECIES.slice(0, S.especies).map((_, i) => i);
  T.espCol = COLORES.map(() => libres[Math.floor(r() * libres.length)]);
  layout(); actualizaHUD();
  if (!S.intro && n === 1) setTimeout(() => toast('Toca una maceta y luego otra para pasar las semillas. Junta 4 iguales y florecerán 🌸'), 700);
}
function reiniciaNivel() {
  T.pots = copia(T.ini); T.vis = T.pots.map(nuevoVis); T.hist = []; T.sel = -1; T.vuelos = []; T.pista = null;
  T.usadosDeshacer = 0; T.extra = false; T.fin = false; T.mov = 0; layout(); actualizaHUD(); Aud.boton();
}

// ---------- Entrada ----------
function potEn(x, y) {
  let mejor = -1, md = 1e9;
  T.slots.forEach((s, i) => {
    if (x >= s.x - T.d * .3 && x <= s.x + s.w + T.d * .3 && y >= s.y - T.d * 1.2 && y <= s.y + s.h + T.d * .3) {
      const dd = Math.abs(x - s.cx); if (dd < md) { md = dd; mejor = i; }
    }
  });
  return mejor;
}
cv.addEventListener('pointerdown', e => {
  Aud.init(); Aud.reanuda();
  if (T.modo !== 'juego' || T.bloqueaModal || T.fin) return;
  const i = potEn(e.clientX, e.clientY);
  if (i >= 0) toca(i);
});
function seleccionable(i) { const p = T.pots[i]; return p.length > 0 && !completa(p) && T.vis[i].llega === 0; }
function toca(i) {
  T.pista = null;
  if (T.sel === -1) {
    if (seleccionable(i)) { T.sel = i; Aud.elige(); vibra(8); } else { T.vis[i].shake = 1; Aud.error(); }
    return;
  }
  if (T.sel === i) { T.sel = -1; Aud.suelta(); return; }
  if (T.vis[T.sel].llega === 0 && puedeMover(T.pots, T.sel, i)) { intentaMover(T.sel, i); return; }
  if (seleccionable(i)) { T.sel = i; Aud.elige(); return; }   // cambia de selección
  T.vis[i].shake = 1; Aud.error(); vibra(12);
}
function liftActual(i) { return T.d * 0.95 * ease.out(T.vis[i].sel); }
function intentaMover(a, b) {
  const P = T.pots;
  if (!puedeMover(P, a, b)) return false;
  T.hist.push(copia(P)); if (T.hist.length > 80) T.hist.shift();
  const A = P[a], B = P[b], k = Math.min(racha(A), CAP - B.length), i0 = A.length - k, j0 = B.length, c = A[A.length - 1].c;
  const lift = liftActual(a), orig = [];
  for (let j = 0; j < k; j++) { const p = posSemilla(a, i0 + j); orig.push({ x: p.x, y: p.y - lift }); }
  mueve(P, a, b);
  for (let j = 0; j < k; j++) {
    const dst = posSemilla(b, j0 + j);
    T.vuelos.push({ c, x0: orig[j].x, y0: orig[j].y, x1: dst.x, y1: dst.y, t0: T.t + (k - 1 - j) * 0.07, dur: 0.36, b, idx: j0 + j });
  }
  T.vis[b].llega += k; T.sel = -1; T.pista = null; T.mov++;
  Aud.suelta(); vibra(10);
  return true;
}
function deshacer() {
  if (T.modo !== 'juego' || T.fin || !T.hist.length) { if (!T.hist.length) toast('No hay nada que deshacer'); return; }
  const gratis = esPlus() || T.usadosDeshacer < CFG.deshacerGratis;
  if (!gratis && !gasta(CFG.costeDeshacer)) return;
  const snap = T.hist.pop();
  while (snap.length < T.pots.length) snap.push([]);
  T.pots = snap; T.vuelos = []; T.sel = -1; T.pista = null;
  T.vis = T.pots.map(p => { const v = nuevoVis(); if (completa(p)) v.bloom = T.t - 10; return v; });
  T.usadosDeshacer++; Aud.boton(); actualizaHUD();
}
function anadeMaceta() {

  if (T.extra) { toast('Ya añadió una maceta extra en este nivel'); return; }

}

  if (T.modo !== 'juego' || T.fin) return;

  let pago = null;
  if (esPlus() && S.pistasDiaUsadas < 3) pago = 'plus';
  else if (S.pistas > 0) pago = 'pistas';
  else if (S.monedas >= CFG.costePista) pago = 'monedas';
  else { sinSaldo(CFG.costePista, 'una pista'); return; }
  const sol = resolver(T.pots, 15000);
  let mv = sol && sol[0];
  if (!mv) { for (let a = 0; a < T.pots.length && !mv; a++) for (let b = 0; b < T.pots.length && !mv; b++) if (movimientoUtil(T.pots, a, b)) mv = { a, b }; }
  if (!mv) { toast('No quedan movimientos: deshaga un paso o añada una maceta'); return; }
  if (pago === 'plus') S.pistasDiaUsadas++; else if (pago === 'pistas') S.pistas--; else monedas(-CFG.costePista);
  guarda();
  T.pista = { a: mv.a, b: mv.b, t0: T.t }; T.sel = -1; Aud.campana(PENTA[4], 0, .1, .6); actualizaHUD();
}

// ---------- Efectos ----------
function chorro(x, y, ci, n = 14, tipo = 'petalo') {
  const C = COLORES[ci] || COLORES[0];
  for (let i = 0; i < n; i++) {
    const a = Math.random() * TAU, v = 60 + Math.random() * 160;
    T.parts.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 90, g: 260, life: 0, max: .9 + Math.random() * .7, r: 4 + Math.random() * 6, col: i % 3 ? C.b : C.l, tipo, rot: Math.random() * 6, vr: (Math.random() - .5) * 8 });
  }
}
function confeti() {
  for (let i = 0; i < 90; i++) {
    const C = COLORES[i % COLORES.length];
    T.parts.push({ x: Math.random() * T.w, y: -20 - Math.random() * T.h * .4, vx: (Math.random() - .5) * 60, vy: 80 + Math.random() * 140, g: 20, life: 0, max: 3 + Math.random() * 2, r: 5 + Math.random() * 7, col: Math.random() < .5 ? C.b : C.l, tipo: 'petalo', rot: Math.random() * 6, vr: (Math.random() - .5) * 6 });
  }
}
function actualizaPartes(dt) {
  for (const p of T.parts) { p.life += dt; p.vy += p.g * dt; p.x += p.vx * dt; p.y += p.vy * dt; p.rot += p.vr * dt; p.vx *= .995; }
  T.parts = T.parts.filter(p => p.life < p.max);
}
function dibujaPartes() {
  for (const p of T.parts) {
    const a = clamp(1 - p.life / p.max, 0, 1);
    ctx.save(); ctx.globalAlpha = Math.min(1, a * 1.6); ctx.translate(p.x, p.y); ctx.rotate(p.rot); ctx.fillStyle = p.col;
    if (p.tipo === 'chispa') { ctx.beginPath(); ctx.arc(0, 0, p.r * a, 0, TAU); ctx.fill(); }
    else { ctx.beginPath(); ctx.ellipse(0, 0, p.r, p.r * .55, 0, 0, TAU); ctx.fill(); }
    ctx.restore();
  }
}

// ---------- Actualización por fotograma ----------
function actualiza(dt) {
  if (T.modo !== 'juego') return;
  T.vis.forEach((v, i) => {
    const obj = T.sel === i ? 1 : 0;
    v.sel += (obj - v.sel) * Math.min(1, dt * 16);
    if (v.shake > 0) v.shake = Math.max(0, v.shake - dt * 3.2);
  });
  // semillas en vuelo
  for (let k = T.vuelos.length - 1; k >= 0; k--) {
    const f = T.vuelos[k];
    if (T.t >= f.t0 + f.dur) {
      T.vuelos.splice(k, 1);
      const v = T.vis[f.b]; if (v) v.llega = Math.max(0, v.llega - 1);
      const q = posSemilla(f.b, f.idx);
      chorro(q.x, q.y, f.c, 4, 'chispa'); Aud.pon(f.idx + (T.mov % 3));
      if (v && v.llega === 0 && T.pots[f.b] && completa(T.pots[f.b]) && v.bloom == null) florece(f.b);
      if (!T.vuelos.length) { revisaFin(); }
    }
  }
  if (T.fin && !T.ganando && T.t - T.finT > 1.5) { T.ganando = true; ganaNivel(); }
}
function florece(i) {
  const v = T.vis[i], c = T.pots[i][0].c, s = T.slots[i];
  v.bloom = T.t; T.floresNivel++; S.floresTotal++;
  Aud.flor(); vibra([20, 40, 30]);
  chorro(s.cx, s.y, c, 22, 'petalo'); chorro(s.cx, s.y, c, 8, 'chispa');
  mision('flores', 1);
}
function revisaFin() {
  if (T.fin) return;
  if (resuelto(T.pots) && T.vis.every(v => v.llega === 0)) { T.fin = true; T.finT = T.t; T.sel = -1; return; }
  if (!hayMovimientos(T.pots) && T.hist.length) toast('No quedan movimientos. Sin prisa: deshaga un paso o añada una maceta 🌱');
}

// ---------- Dibujo del tablero ----------
function dibujaTablero() {
  const skin = MACETAS[S.maceta] || MACETAS.terracota, estilo = S.semilla, d = T.d;
  T.slots.forEach((s, i) => {
    const v = T.vis[i], P = T.pots[i];
    const x = s.x + (v.shake > 0 ? Math.sin(T.t * 70) * 5 * v.shake : 0), y = s.y;
    const sx = { x, y, w: s.w, h: s.h };
    dibujaMaceta(ctx, x, y, s.w, s.h, skin, d, { sel: T.sel === i });
    if (T.pista && (T.pista.a === i || T.pista.b === i)) {
      const pu = .5 + .5 * Math.sin((T.t - T.pista.t0) * 6);
      ctx.save(); ctx.strokeStyle = `rgba(255,255,255,${.55 + .45 * pu})`; ctx.lineWidth = 4 + pu * 3; ctx.shadowColor = T.pista.a === i ? '#ffb199' : '#8fe0ac'; ctx.shadowBlur = 18;
      rr(ctx, x - 4, y + d * .12, s.w + 8, s.h - d * .1, s.w * .36); ctx.stroke(); ctx.restore();
    }
    const bl = v.bloom == null ? 0 : clamp((T.t - v.bloom) / 1.5, 0, 1);
    const nVis = P.length - v.llega, lift = liftActual(i), nTop = T.sel === i ? racha(P) : 0;
    const levantadas = [];
    for (let j = 0; j < nVis; j++) {
      const pos = posSemilla(i, j), q = P[j];
      const alta = nTop && j >= P.length - nTop;
      const o = { oculta: !q.v, alpha: 1 - Math.min(1, bl * 1.8) };
      if (alta) levantadas.push({ x: pos.x + (x - s.x), y: pos.y - lift, c: q.c, o }); else if (o.alpha > .01) dibujaSemilla(ctx, pos.x + (x - s.x), pos.y, d * .94, q.c, estilo, o);
    }
    dibujaMacetaFrente(ctx, x, y, s.w, s.h, skin, d);
    for (const l of levantadas) {
      ctx.fillStyle = 'rgba(80,50,30,.14)'; ctx.beginPath(); ctx.ellipse(l.x, l.y + d * .55 + lift * .3, d * .3, d * .08, 0, 0, TAU); ctx.fill();
      dibujaSemilla(ctx, l.x, l.y, d * .94, l.c, estilo, l.o);
    }
    if (bl > 0) {
      const baseY = y + s.h - d * .55, R = Math.min(s.w * .62, d * .78);
      dibujaFlorCrecida(ctx, s.cx, baseY, y - R * .35, R, ESPECIES[T.espCol[P[0].c] || 0].f, P[0].c, bl, T.t);
    }
  });
  // semillas volando
  for (const f of T.vuelos) {
    const u = (T.t - f.t0) / f.dur; if (u < 0) { dibujaSemilla(ctx, f.x0, f.y0, T.d * .94, f.c, S.semilla); continue; }
    const e = ease.inOut(clamp(u, 0, 1)), arco = Math.min(f.y0, f.y1) - T.d * 1.1;
    const x = lerp(f.x0, f.x1, e), y = (1 - e) * (1 - e) * f.y0 + 2 * (1 - e) * e * arco + e * e * f.y1;
    const sq = 1 + Math.sin(clamp(u, 0, 1) * Math.PI) * .06;
    dibujaSemilla(ctx, x, y, T.d * .94, f.c, S.semilla, { sx: 1 / sq, sy: sq });
    if (Math.random() < .5) T.parts.push({ x, y, vx: (Math.random() - .5) * 30, vy: (Math.random() - .5) * 30, g: 0, life: 0, max: .35, r: 3, col: COLORES[f.c].l, tipo: 'chispa', rot: 0, vr: 0 });
  }
  // flecha de la pista
  if (T.pista) {
    const s = T.slots[T.pista.b], bob = Math.sin((T.t - T.pista.t0) * 7) * 6;
    ctx.fillStyle = 'rgba(255,255,255,.95)'; ctx.strokeStyle = '#e2705a'; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(s.cx, s.y - d * .25 + bob); ctx.lineTo(s.cx - d * .22, s.y - d * .62 + bob); ctx.lineTo(s.cx + d * .22, s.y - d * .62 + bob); ctx.closePath(); ctx.fill(); ctx.stroke();
  }
}

// ---------- Escena de jardín (pantalla de inicio y galería) ----------
function dibujaEscena(c, w, h, flores, t, tema, alt = .55) {
  const TM = TEMAS[tema] || TEMAS.amanecer;
  const colina = (base, amp, fase, col) => {
    c.fillStyle = col; c.beginPath(); c.moveTo(0, h);
    for (let x = 0; x <= w + 8; x += 8) c.lineTo(x, h * base + Math.sin(x / w * 3.2 + fase) * h * amp);
    c.lineTo(w, h); c.closePath(); c.fill();
  };
  colina(alt - .02, .028, .6, TM.suelo + 'aa'); colina(alt + .06, .03, 2.1, TM.suelo);
  const lista = flores.slice().sort((a, b) => a.y - b.y);
  for (const fl of lista) {
    const px = fl.x * w, py = h * (alt + .1) + fl.y * h * (1 - alt - .16);
    const R = lerp(.032, .066, fl.y) * Math.min(w, h * .9);
    dibujaFlorCrecida(c, px, py, py - R * 2.8, R, ESPECIES[fl.e % ESPECIES.length].f, fl.c, 1, t + fl.x * 5);
  }
  for (let k = 0; k < 3; k++) {                                    // mariposas
    const bx = (.2 + .3 * k + .15 * Math.sin(t * .3 + k * 2)) * w, by = h * (alt - .1 - .08 * k) + Math.sin(t * .9 + k) * h * .03, a = Math.sin(t * 14 + k) * .7;
    c.save(); c.translate(bx, by); c.fillStyle = COLORES[(k * 3 + 1) % 10].b;
    for (const sg of [-1, 1]) { c.save(); c.scale(sg * Math.abs(Math.cos(a)) , 1); c.beginPath(); c.ellipse(7, -3, 8, 5, -.4, 0, TAU); c.fill(); c.beginPath(); c.ellipse(5, 4, 6, 4, .4, 0, TAU); c.fill(); c.restore(); }
    c.restore();
  }
}
function floresInicio() {
  if (S.jardin.length) return S.jardin.slice(-10).map((f, i) => ({ ...f, x: .08 + .84 * (i + .5) / 10, y: (i % 3) * .08 }));
  return [0, 1, 2, 3, 4].map(i => ({ e: i % 3, c: [0, 2, 1, 4, 5][i], x: .12 + i * .19, y: (i % 2) * .12 }));
}

// ---------- Bucle principal ----------
let ultimo = 0;
function frame(ts) {
  const dt = Math.min(.05, (ts - ultimo) / 1000 || 0); ultimo = ts; T.t += dt;
  const tema = TEMAS[S.tema] ? S.tema : 'amanecer';
  document.body.classList.toggle('oscuro', !!TEMAS[tema].osc);
  if (T.modo !== 'jardin') {
    dibujaFondo(ctx, T.w, T.h, tema, T.t);
    if (T.modo === 'home') dibujaEscena(ctx, T.w, T.h, floresInicio(), T.t, tema, .6);
    if (T.modo === 'juego') { actualiza(dt); dibujaTablero(); }
    actualizaPartes(dt); dibujaPartes();
  } else { dibujaJardin(T.t); actualizaPartes(dt); }
  requestAnimationFrame(frame);
}

  const premio = (30 + 10 * racha) * (esPlus() ? 2 : 1);
  modal(`<h2>🌼 Regalo del día</h2><p class="cen">Un detalle para su jardín.</p><div class="mono" style="margin:14px 0"><span>🪙</span><span class="conf-n">+${premio}</span></div>
    ${racha > 1 ? `<p class="cen">Lleva ${racha} días seguidos viniendo. ¡Qué bien!</p>` : ''}
    <div class="cen" style="margin-top:10px"><button class="btn verde" data-a="ok">Recoger</button></div>`);
  enlaza({ ok: () => { S.ultimoRegalo = h; S.racha = racha; monedas(premio); Aud.moneda(); cierra(); actualizaHUD(); } });
}

// ---------- Ajustes ----------
function abreAjustes() {
  const fila = (k, t, s) => `<div class="interr"><div><b>${t}</b><div style="font-size:12px;color:var(--tx2)">${s}</div></div><button class="sw ${S.ajustes[k] ? 'on' : ''}" data-a="s-${k}"></button></div>`;
  modal(`<h2>Ajustes</h2>` + fila('sonido', 'Sonidos', 'Efectos suaves') + fila('musica', 'Música ambiente', 'Campanillas tranquilas') + fila('vibracion', 'Vibración', 'Al florecer y mover') +
    fila('daltonico', 'Símbolos en las semillas', 'Ayuda si cuesta distinguir colores') +
    `<div class="cen" style="margin-top:10px;display:flex;flex-direction:column;gap:8px;align-items:center">
      <a href="politica_privacidad.html" target="_blank" style="color:var(--tx2)">Política de privacidad</a>
      <button class="btn sec" data-a="reset">Borrar mi progreso</button>
      <button class="btn" data-a="x">Listo</button><div style="font-size:11px;color:var(--tx2)">Ansiedad ${CFG.version}</div></div>`);
  const mp = { x: cierra, reset: () => { modal(`<h2>¿Borrar todo?</h2><p class="cen">Se perderán niveles, monedas y jardín. No se puede deshacer.</p><div class="cen" style="display:flex;gap:10px;justify-content:center"><button class="btn chico" data-a="si">Sí, borrar</button><button class="btn sec" data-a="no">No</button></div>`); enlaza({ no: abreAjustes, si: () => { localStorage.removeItem(CLAVE); location.reload(); } }); } };
  ['sonido', 'musica', 'vibracion', 'daltonico'].forEach(k => (mp['s-' + k] = () => { S.ajustes[k] = !S.ajustes[k]; guarda(); if (k === 'musica' || k === 'sonido') Aud.musica(S.ajustes.musica && S.ajustes.sonido); abreAjustes(); }));
  enlaza(mp);
}

// ---------- Fin de nivel ----------
function ganaNivel() {
  const prm = T.prm, base = 20 + 6 * prm.colores, bono = T.usadosDeshacer === 0 ? 10 : 0;
  let total = base + bono; if (esPlus()) total = Math.round(total * 1.3);
  S.completados++; if (T.n >= S.nivel) S.nivel = T.n + 1;
  const flor = { e: Math.floor(Math.random() * S.especies), c: Math.floor(Math.random() * COLORES.length), x: .04 + Math.random() * .92, y: Math.random() };
  S.jardin.push(flor); if (S.jardin.length > 220) S.jardin.shift();
  let nueva = null;
  if (S.completados % 6 === 0 && S.especies < ESPECIES.length) { nueva = ESPECIES[S.especies]; S.especies++; }
  S.intro = true; monedas(total); guarda();
  mision('niveles', 1); if (T.usadosDeshacer === 0) mision('sinDeshacer', 1);
  Aud.gana(); vibra([30, 50, 30, 50, 60]); confeti();
  const permitirDoble = !esPlus();
  modal(`<h2>¡Nivel ${T.n} completado!</h2><p class="cen">Su jardín tiene una flor más 🌸</p>
    <div class="mono" style="margin:12px 0"><span>🪙</span><span class="conf-n">+${total}</span></div>
    ${bono ? '<p class="cen" style="font-size:13px">Incluye +10 por no deshacer ningún paso</p>' : ''}
    ${nueva ? `<div class="tarjeta destacada"><div class="ico">✨</div><div class="t"><b>Flor nueva: ${nueva.n}</b><div>Ya puede verla crecer en su jardín</div></div></div>` : ''}
    <div class="cen" style="display:flex;flex-direction:column;gap:10px;align-items:center;margin-top:8px">
      <button class="btn" data-a="sig">Siguiente nivel</button>
      ${permitirDoble ? `<button class="btn sec" data-a="doble">▶ Doblar monedas (+${total}) viendo un anuncio</button>` : ''}
      <button class="btn sec" data-a="jar">Ver mi jardín</button></div>`, false);
  const sigue = () => { cierra(); const n = S.nivel; const ir = () => { empiezaNivel(n); }; if (S.completados >= CFG.interDesde - 1 && S.completados % CFG.interCada === 0) Anuncios.intersticial(ir); else ir(); };
  enlaza({
    sig: sigue,
    doble: () => { Anuncios.recompensa(() => { monedas(total); Aud.moneda(); toast('¡Monedas dobles! 🌼'); const b = $('#modal [data-a="doble"]'); if (b) b.remove(); }); },
    jar: () => { cierra(); ir('jardin'); }
  });
  actualizaHUD();
}

// ---------- Jardín ----------
const cj = $('#cj'), cjx = cj.getContext('2d');
function ajustaJardin() { cj.width = Math.round(T.w * T.dpr); cj.height = Math.round(T.h * T.dpr); cjx.setTransform(T.dpr, 0, 0, T.dpr, 0, 0); }
function dibujaJardin(t) {
  const tema = TEMAS[S.tema] ? S.tema : 'amanecer';
  dibujaFondo(cjx, T.w, T.h, tema, t);
  dibujaEscena(cjx, T.w, T.h, S.jardin.slice(-80), t, tema, .36);
}
function abreJardin() {
  ajustaJardin();
  $('#j-info').textContent = `🌸 ${S.jardin.length} flores · ${S.especies}/${ESPECIES.length} especies`;
  const cont = $('#jar-especies'); cont.innerHTML = '';
  ESPECIES.forEach((e, i) => {
    const d = document.createElement('div'); d.className = 'esp' + (i < S.especies ? '' : ' bloq');
    d.innerHTML = '<canvas width="120" height="90"></canvas>' + (i < S.especies ? e.n : '???');
    cont.appendChild(d); const g = d.firstChild.getContext('2d');
    if (i < S.especies) dibujaFlor(g, 60, 46, 28, e.f, (i * 3) % 10, 0); else { g.fillStyle = 'rgba(0,0,0,.15)'; g.beginPath(); g.arc(60, 46, 22, 0, TAU); g.fill(); }
  });
}

// ---------- Navegación ----------
function ir(modo) {
  T.modo = modo;
  ['home', 'jardin'].forEach(p => $('#p-' + p).classList.toggle('on', p === modo));
  $('#hud').classList.toggle('on', modo === 'juego');
  if (modo === 'home') { $('#home-nivel').textContent = 'Nivel ' + S.nivel; puntoMisiones(); }
  if (modo === 'jardin') abreJardin();
  if (modo === 'juego') { if (!T.pots.length || T.n !== S.nivel || T.fin) empiezaNivel(S.nivel); else { layout(); actualizaHUD(); } }
  Aud.musica(true);
}
function enlazaPantallas() {
  $('#b-jugar').onclick = () => { Aud.init(); Aud.reanuda(); Aud.boton(); ir('juego'); };
  $('#b-menu').onclick = () => { Aud.boton(); ir('home'); };
  $('#h-jardin').onclick = () => { Aud.boton(); ir('jardin'); };
  $('#j-volver').onclick = () => { Aud.boton(); ir('home'); };
  $('#h-tienda').onclick = () => { Aud.boton(); abreTienda('ofertas'); };
  $('#h-misiones').onclick = () => { Aud.boton(); abreMisiones(); };
  $('#h-ajustes').onclick = () => { Aud.boton(); abreAjustes(); };
  $('#monedas-pill').onclick = () => { Aud.boton(); abreTienda('monedas'); };
  $('#monedas-pill').style.cursor = 'pointer'; $('#monedas-pill').style.pointerEvents = 'auto';
  $('#b-deshacer').onclick = deshacer;
  $('#b-pista').onclick = daPista;
  $('#b-maceta').onclick = anadeMaceta;
  $('#b-reiniciar').onclick = reiniciaNivel;
}

// =====================================================================
//  ARRANQUE
// =====================================================================
function arranca() {
  iniciaFondo(); enlazaPantallas(); ajusta(); ajustaJardin();
  $('#monedas').textContent = fmt(S.monedas);
  document.body.classList.toggle('oscuro', !!(TEMAS[S.tema] && TEMAS[S.tema].osc));
  ir('home'); puntoMisiones();
  requestAnimationFrame(frame);
  setTimeout(regaloDelDia, 600);
  document.addEventListener('visibilitychange', () => { if (document.hidden) Aud.musica(false); else if (T.modo) Aud.musica(true); });
  if ('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('sw.js').catch(() => {});
}
window.addEventListener('error', e => { try { console.log('ERR', e.message); } catch (x) { /* nada */ } });
window.addEventListener('resize', ajustaJardin);
arranca();

</script></body></html>
